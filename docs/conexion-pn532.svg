<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1010" width="1100" height="1010" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Conexión del lector PN532 a la LilyGO T-Display V1.1</title>
  <desc id="desc">Vista frontal de la placa con los 24 pines. Cuatro cables por I2C: GND a G, SDA a 21, SCL a 22 y VCC a 3V, todos en el lado izquierdo.</desc>

  <rect width="1100" height="1010" fill="#ffffff"/>

  <text x="550" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2933">Conexión PN532 a LilyGO T-Display V1.1 (I2C)</text>
  <text x="550" y="68" text-anchor="middle" font-size="15" fill="#52606d">Placa vista de frente, con la pantalla hacia ti y el USB-C abajo. Los nombres de los pines son los de la serigrafía.</text>

  <!-- PN532 -->
  <rect x="60" y="170" width="280" height="240" rx="12" fill="#b3261e"/>
  <text x="130" y="205" font-size="18" font-weight="700" fill="#ffffff">PN532</text>
  <text x="130" y="225" font-size="13" fill="#fde8e6">Lector NFC</text>
  <rect x="85" y="250" width="150" height="130" rx="10" fill="none" stroke="#fbd5d1" stroke-width="3"/>
  <rect x="103" y="268" width="114" height="94" rx="8" fill="none" stroke="#fbd5d1" stroke-width="3"/>
  <text x="160" y="320" text-anchor="middle" font-size="14" fill="#ffffff">Antena</text>
  <g font-size="15" font-weight="700" fill="#ffffff" text-anchor="end">
    <text x="322" y="235">GND</text>
    <text x="322" y="275">SDA</text>
    <text x="322" y="315">SCL</text>
    <text x="322" y="355">VCC</text>
  </g>

  <!-- T-Display body -->
  <rect x="610" y="130" width="280" height="660" rx="14" fill="#1f2933"/>
  <text x="750" y="168" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">T-Display</text>
  <rect x="697" y="186" width="106" height="470" rx="4" fill="#0b1015" stroke="#616e7c" stroke-width="2"/>
  <text x="750" y="425" text-anchor="middle" font-size="14" fill="#9aa5b1">Pantalla</text>

  <rect x="714" y="760" width="72" height="56" rx="6" fill="#9aa5b1"/>
  <text x="750" y="838" text-anchor="middle" font-size="13" fill="#52606d">USB-C</text>
  <rect x="640" y="716" width="42" height="42" rx="6" fill="#cbd2d9"/>
  <rect x="818" y="716" width="42" height="42" rx="6" fill="#cbd2d9"/>
  <text x="661" y="708" text-anchor="middle" font-size="12" fill="#ffffff">GPIO0</text>
  <text x="839" y="708" text-anchor="middle" font-size="12" fill="#ffffff">GPIO35</text>
  <rect x="884" y="662" width="20" height="34" rx="4" fill="#cbd2d9"/>
  <text x="914" y="684" font-size="14" font-weight="700" fill="#52606d">RST</text>

  <!-- Wires -->
  <g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M340 230 H635" stroke="#111827"/>
    <path d="M340 270 H635" stroke="#1570ef"/>
    <path d="M340 310 H635" stroke="#c98a00"/>
    <path d="M340 350 H440 V630 H635" stroke="#d92d20"/>
  </g>
  <g fill="#ffffff" stroke-width="3">
    <circle cx="340" cy="230" r="9" stroke="#111827"/>
    <circle cx="340" cy="270" r="9" stroke="#1570ef"/>
    <circle cx="340" cy="310" r="9" stroke="#c98a00"/>
    <circle cx="340" cy="350" r="9" stroke="#d92d20"/>
  </g>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <text x="510" y="220" fill="#111827">Masa</text>
    <text x="510" y="260" fill="#1570ef">Datos</text>
    <text x="510" y="300" fill="#946200">Reloj</text>
    <text x="520" y="620" fill="#d92d20">3,3 V (nunca a 5V)</text>
  </g>

  <!-- Left header, top to bottom -->
  <g fill="#f5c542" stroke="#7b5e00" stroke-width="2">
    <circle cx="635" cy="190" r="9"/>
    <circle cx="635" cy="350" r="9"/>
    <circle cx="635" cy="390" r="9"/>
    <circle cx="635" cy="430" r="9"/>
    <circle cx="635" cy="470" r="9"/>
    <circle cx="635" cy="510" r="9"/>
    <circle cx="635" cy="550" r="9"/>
    <circle cx="635" cy="590" r="9"/>
  </g>
  <circle cx="635" cy="230" r="11" fill="#111827" stroke="#ffffff" stroke-width="3"/>
  <circle cx="635" cy="270" r="11" fill="#1570ef" stroke="#ffffff" stroke-width="3"/>
  <circle cx="635" cy="310" r="11" fill="#c98a00" stroke="#ffffff" stroke-width="3"/>
  <circle cx="635" cy="630" r="11" fill="#d92d20" stroke="#ffffff" stroke-width="3"/>
  <g font-size="15" font-weight="700" fill="#ffffff">
    <text x="654" y="195">G</text>
    <text x="654" y="235">G</text>
    <text x="654" y="275">21</text>
    <text x="654" y="315">22</text>
    <text x="654" y="355">17</text>
    <text x="654" y="395">2</text>
    <text x="654" y="435">15</text>
    <text x="654" y="475">13</text>
    <text x="654" y="515">12</text>
    <text x="654" y="555">G</text>
    <text x="654" y="595">G</text>
    <text x="654" y="635">3V</text>
  </g>

  <!-- Right header, top to bottom -->
  <g fill="#f5c542" stroke="#7b5e00" stroke-width="2">
    <circle cx="865" cy="190" r="9"/>
    <circle cx="865" cy="230" r="9"/>
    <circle cx="865" cy="270" r="9"/>
    <circle cx="865" cy="310" r="9"/>
    <circle cx="865" cy="350" r="9"/>
    <circle cx="865" cy="390" r="9"/>
    <circle cx="865" cy="430" r="9"/>
    <circle cx="865" cy="470" r="9"/>
    <circle cx="865" cy="510" r="9"/>
    <circle cx="865" cy="550" r="9"/>
    <circle cx="865" cy="590" r="9"/>
    <circle cx="865" cy="630" r="9"/>
  </g>
  <g font-size="15" font-weight="700" fill="#ffffff" text-anchor="end">
    <text x="846" y="195">3V</text>
    <text x="846" y="235">36</text>
    <text x="846" y="275">37</text>
    <text x="846" y="315">38</text>
    <text x="846" y="355">39</text>
    <text x="846" y="395">32</text>
    <text x="846" y="435">33</text>
    <text x="846" y="475">25</text>
    <text x="846" y="515">26</text>
    <text x="846" y="555">27</text>
    <text x="846" y="595">G</text>
    <text x="846" y="635">5V</text>
  </g>

  <!-- Left outer legend for the free pins -->
  <g font-size="13" fill="#52606d" text-anchor="end">
    <text x="598" y="195">GND libre</text>
    <text x="598" y="355">libre</text>
    <text x="598" y="395">libre</text>
    <text x="598" y="435">libre</text>
    <text x="598" y="475">libre</text>
    <text x="598" y="515">libre</text>
    <text x="598" y="555">GND libre</text>
    <text x="598" y="595">GND libre</text>
  </g>

  <!-- Right outer legend -->
  <g font-size="13" fill="#52606d">
    <text x="908" y="195">3,3 V</text>
    <text x="908" y="235">solo entrada (SVP)</text>
    <text x="908" y="275">solo entrada</text>
    <text x="908" y="315">solo entrada</text>
    <text x="908" y="355">solo entrada (SVN)</text>
    <text x="908" y="395">libre</text>
    <text x="908" y="435">libre</text>
    <text x="908" y="475">libre</text>
    <text x="908" y="515">libre</text>
    <text x="908" y="555">libre</text>
    <text x="908" y="595">GND</text>
    <text x="908" y="635">5 V (no usar aquí)</text>
  </g>

  <!-- Notes -->
  <rect x="60" y="860" width="980" height="125" rx="10" fill="#f5f7fa" stroke="#cbd2d9"/>
  <text x="84" y="888" font-size="16" font-weight="700" fill="#1f2933">Antes de encender</text>
  <g font-size="15" fill="#323f4b">
    <text x="84" y="914">1. Conecta los cables con la placa desenchufada. El orden de pines de tu PN532 puede ser distinto: guíate por su serigrafía.</text>
    <text x="84" y="938">2. Pon el interruptor del módulo en modo I2C: suele ser SEL0 = ON y SEL1 = OFF; compruébalo en tu módulo.</text>
    <text x="84" y="962">3. Reinicia la placa después de conectarlo. Si tu placa no es la V1.1, comprueba que su serigrafía coincide con este dibujo.</text>
  </g>
</svg>
